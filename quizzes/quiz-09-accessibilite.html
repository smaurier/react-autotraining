<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz 09 — Accessibilite React (WCAG)</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; padding: 2rem 1rem; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; color: #ffffff; }
    .subtitle { text-align: center; color: #8892b0; margin-bottom: 2rem; font-size: 1rem; }
    .progress-bar-container { background: #0d1117; border-radius: 10px; height: 14px; margin-bottom: 2rem; overflow: hidden; }
    .progress-bar { background: linear-gradient(90deg, #0d6efd, #4dabf7); height: 100%; width: 0%; border-radius: 10px; transition: width 0.4s ease; }
    .progress-text { text-align: center; color: #8892b0; margin-bottom: 1rem; font-size: 0.9rem; }
    .card { background: #16213e; border-radius: 12px; padding: 2rem; margin-bottom: 1.5rem; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .question-label { font-size: 0.85rem; color: #4dabf7; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem; }
    .question-text { font-size: 1.15rem; margin-bottom: 1.2rem; line-height: 1.5; color: #ffffff; }
    pre { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; margin-bottom: 1.2rem; overflow-x: auto; font-size: 0.95rem; }
    code { font-family: 'Consolas', 'Fira Code', 'Courier New', monospace; color: #c9d1d9; }
    .options { list-style: none; }
    .options li { margin-bottom: 0.5rem; }
    .options label { display: flex; align-items: center; gap: 0.75rem; padding: 0.8rem 1rem; background: #0d1117; border: 2px solid #30363d; border-radius: 8px; cursor: pointer; transition: border-color 0.2s, background 0.2s; font-size: 1rem; }
    .options label:hover { border-color: #4dabf7; background: #1c2a4a; }
    .options input[type="radio"] { accent-color: #0d6efd; width: 18px; height: 18px; flex-shrink: 0; }
    .btn { display: inline-block; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; }
    .btn-primary { background: #0d6efd; color: #fff; }
    .btn-primary:hover { background: #3b82f6; }
    .btn-primary:disabled { background: #374151; cursor: not-allowed; }
    .btn-restart { background: #238636; color: #fff; margin-top: 1rem; padding: 0.7rem 2rem; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; }
    .btn-restart:hover { background: #2ea043; }
    .feedback { margin-top: 1rem; padding: 1rem 1.2rem; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; display: none; }
    .feedback.correct { background: #0f5132; border: 1px solid #198754; color: #d1fae5; display: block; }
    .feedback.wrong { background: #842029; border: 1px solid #dc3545; color: #fdd; display: block; }
    .score-card { text-align: center; padding: 3rem 2rem; }
    .score-card .score { font-size: 3rem; font-weight: 700; color: #4dabf7; margin-bottom: 0.5rem; }
    .score-card .score-label { font-size: 1.2rem; color: #8892b0; margin-bottom: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quiz 09 — Accessibilite React (WCAG)</h1>
    <p class="subtitle">JSX semantique, gestion du focus, aria-live, navigation clavier, jest-axe</p>
    <div class="progress-bar-container"><div class="progress-bar" id="progressBar"></div></div>
    <p class="progress-text" id="progressText">Question 1 / 5</p>
    <div id="quizContainer"></div>
    <div id="scoreContainer" class="card score-card hidden"></div>
  </div>
  <script>
    const questions = [
      {
        label: "Question 1",
        text: "Pourquoi faut-il privilegier les elements HTML semantiques (&lt;button&gt;, &lt;nav&gt;, &lt;main&gt;) plutot que des &lt;div&gt; avec des roles ARIA dans un composant React ?",
        code: "// Approche A\n<div role=\"button\" tabIndex={0} onClick={handleClick}>\n  Envoyer\n</div>\n\n// Approche B\n<button onClick={handleClick}>\n  Envoyer\n</button>",
        options: [
          "Les elements semantiques sont plus rapides a rendre par React",
          "Les elements natifs fournissent gratuitement le comportement clavier, le role ARIA et le focus, sans code supplementaire",
          "ARIA est deprecie depuis HTML5 et ne doit plus etre utilise",
          "Les &lt;div&gt; ne peuvent pas recevoir d'evenements onClick en React"
        ],
        answer: 1,
        explanation: "Un &lt;button&gt; natif gere automatiquement la navigation clavier (Enter, Espace), expose le role button aux lecteurs d'ecran et est focusable par defaut. Utiliser un &lt;div role=\"button\"&gt; oblige a reimplementer manuellement tout ce comportement (onKeyDown, tabIndex, etc.), ce qui est fragile et source d'oublis. La premiere regle d'ARIA est : n'utilisez pas ARIA si un element HTML natif existe."
      },
      {
        label: "Question 2",
        text: "Comment gerer correctement le deplacement du focus apres une navigation dans une Single Page Application React (avec React Router) ?",
        code: "function PageLayout({ children }) {\n  const mainRef = useRef(null);\n  const location = useLocation();\n\n  useEffect(() => {\n    // Que faut-il faire ici ?\n  }, [location.pathname]);\n\n  return &lt;main ref={mainRef} tabIndex={-1}&gt;{children}&lt;/main&gt;;\n}",
        options: [
          "Rien, le navigateur gere automatiquement le focus lors des changements de route",
          "Appeler mainRef.current.focus() pour deplacer le focus vers le contenu principal a chaque changement de route",
          "Ajouter autoFocus sur chaque composant de page",
          "Utiliser window.scrollTo(0, 0) qui deplace aussi le focus"
        ],
        answer: 1,
        explanation: "Dans une SPA, le navigateur ne deplace pas le focus lors d'un changement de route cote client. Les utilisateurs de lecteurs d'ecran restent bloques sur l'ancien contenu. Il faut explicitement deplacer le focus vers le conteneur principal (avec tabIndex={-1} pour qu'il soit focusable par script sans etre dans l'ordre de tabulation naturel). scrollTo ne modifie pas le focus."
      },
      {
        label: "Question 3",
        text: "Quel est le role de l'attribut aria-live et comment l'utiliser correctement dans React pour annoncer une mise a jour dynamique ?",
        code: "function SearchResults({ results, query }) {\n  return (\n    &lt;div&gt;\n      &lt;div aria-live=\"polite\" role=\"status\"&gt;\n        {results.length} resultats pour \"{query}\"\n      &lt;/div&gt;\n      &lt;ul&gt;\n        {results.map(r =&gt; &lt;li key={r.id}&gt;{r.title}&lt;/li&gt;)}\n      &lt;/ul&gt;\n    &lt;/div&gt;\n  );\n}",
        options: [
          "aria-live force le lecteur d'ecran a interrompre immediatement toute annonce en cours",
          "aria-live=\"polite\" signale au lecteur d'ecran d'annoncer le changement de contenu de la region a la prochaine pause, sans interrompre l'utilisateur",
          "aria-live n'a aucun effet dans React car le Virtual DOM empeche la detection des changements",
          "aria-live est necessaire uniquement sur les elements &lt;input&gt; pour valider les formulaires"
        ],
        answer: 1,
        explanation: "aria-live=\"polite\" cree une region live : quand le contenu textuel de cet element change, le lecteur d'ecran l'annoncera a la prochaine opportunite (sans couper l'annonce en cours). En React, cela fonctionne parfaitement car le DOM reel est mis a jour apres le rendu virtuel, et les technologies d'assistance detectent ces modifications. Utilisez aria-live=\"assertive\" uniquement pour les messages urgents (erreurs critiques)."
      },
      {
        label: "Question 4",
        text: "Comment implementer correctement la navigation au clavier dans un composant React de type menu deroulant (dropdown) ?",
        code: "function Dropdown({ items }) {\n  const [isOpen, setIsOpen] = useState(false);\n  const [activeIndex, setActiveIndex] = useState(-1);\n\n  const handleKeyDown = (e) =&gt; {\n    switch (e.key) {\n      case 'ArrowDown':\n        e.preventDefault();\n        setActiveIndex(i =&gt; Math.min(i + 1, items.length - 1));\n        break;\n      case 'ArrowUp':\n        e.preventDefault();\n        setActiveIndex(i =&gt; Math.max(i - 1, 0));\n        break;\n      case 'Escape':\n        setIsOpen(false);\n        break;\n    }\n  };\n  // ...\n}",
        options: [
          "Ajouter un onClick sur chaque element suffit, les utilisateurs clavier peuvent utiliser Tab entre les items",
          "Il faut gerer ArrowUp/ArrowDown pour naviguer entre les items, Escape pour fermer, et utiliser les roles menu/menuitem avec aria-activedescendant",
          "La navigation clavier est geree automatiquement par React si on utilise des &lt;li&gt;",
          "Il suffit d'ajouter tabIndex={0} a chaque item du menu"
        ],
        answer: 1,
        explanation: "Le pattern ARIA menu exige une navigation par fleches (ArrowUp/Down) entre les items, Escape pour fermer, et Enter/Espace pour selectionner. On utilise aria-activedescendant pour indiquer l'item actif au lecteur d'ecran sans deplacer le focus DOM. Ajouter tabIndex={0} a chaque item est deconseille car cela cree trop d'arrets de tabulation — les menus doivent etre un seul arret de tabulation avec navigation interne par fleches."
      },
      {
        label: "Question 5",
        text: "Quel outil permet de tester automatiquement l'accessibilite dans des tests unitaires React, et que detecte-t-il ?",
        code: "import { render } from '@testing-library/react';\nimport { axe, toHaveNoViolations } from 'jest-axe';\n\nexpect.extend(toHaveNoViolations);\n\ntest('le formulaire ne contient pas de violations a11y', async () =&gt; {\n  const { container } = render(&lt;LoginForm /&gt;);\n  const results = await axe(container);\n  expect(results).toHaveNoViolations();\n});",
        options: [
          "jest-axe execute un audit Lighthouse complet et mesure le score de performance",
          "jest-axe lance axe-core sur le DOM rendu et detecte les violations WCAG automatisables (labels manquants, contraste insuffisant, roles invalides, etc.)",
          "jest-axe simule un lecteur d'ecran et verifie que tout le contenu est lu correctement",
          "jest-axe ne fonctionne qu'avec Enzyme et ne supporte pas Testing Library"
        ],
        answer: 1,
        explanation: "jest-axe integre le moteur axe-core de Deque dans les tests Jest/Vitest. Il analyse le DOM rendu et detecte automatiquement environ 30 a 40% des problemes d'accessibilite WCAG : images sans alt, formulaires sans labels, hierarchie de headings incorrecte, contrastes insuffisants, roles ARIA invalides, etc. Il ne remplace pas les tests manuels avec un lecteur d'ecran, mais constitue un filet de securite essentiel dans la CI."
      }
    ];

    let currentQuestion = 0, score = 0, answered = false;

    function renderQuestion() {
      const q = questions[currentQuestion];
      const total = questions.length;
      document.getElementById('progressBar').style.width = ((currentQuestion / total) * 100) + '%';
      document.getElementById('progressText').textContent = `Question ${currentQuestion + 1} / ${total}`;
      let html = `<div class="card">
        <p class="question-label">${q.label}</p>
        <p class="question-text">${q.text}</p>`;
      if (q.code) {
        html += `<pre><code>${q.code}</code></pre>`;
      }
      html += `<ul class="options">`;
      q.options.forEach((opt, i) => {
        html += `<li><label><input type="radio" name="q" value="${i}"> ${opt}</label></li>`;
      });
      html += `</ul>
        <button class="btn btn-primary" id="validateBtn" onclick="validate()" disabled>Valider</button>
        <div class="feedback" id="feedback"></div>
      </div>`;
      document.getElementById('quizContainer').innerHTML = html;
      document.querySelectorAll('input[name="q"]').forEach(r => {
        r.addEventListener('change', () => {
          document.getElementById('validateBtn').disabled = false;
        });
      });
      answered = false;
    }

    function validate() {
      if (answered) {
        currentQuestion++;
        if (currentQuestion < questions.length) {
          renderQuestion();
        } else {
          showScore();
        }
        return;
      }
      answered = true;
      const selected = document.querySelector('input[name="q"]:checked');
      if (!selected) return;
      const val = parseInt(selected.value);
      const q = questions[currentQuestion];
      const fb = document.getElementById('feedback');
      const btn = document.getElementById('validateBtn');
      document.querySelectorAll('input[name="q"]').forEach(r => r.disabled = true);
      if (val === q.answer) {
        score++;
        fb.className = 'feedback correct';
        fb.innerHTML = `<strong>Correct !</strong> ${q.explanation}`;
      } else {
        fb.className = 'feedback wrong';
        fb.innerHTML = `<strong>Incorrect.</strong> ${q.explanation}`;
      }
      btn.textContent = currentQuestion < questions.length - 1 ? 'Suivant' : 'Voir le score';
    }

    function showScore() {
      document.getElementById('quizContainer').classList.add('hidden');
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('progressText').textContent = `Termine !`;
      const sc = document.getElementById('scoreContainer');
      sc.classList.remove('hidden');
      const pct = Math.round((score / questions.length) * 100);
      let msg = pct === 100 ? 'Parfait !' : pct >= 60 ? 'Bien joue !' : 'Continuez a reviser !';
      sc.innerHTML = `<div class="score">${score} / ${questions.length}</div>
        <div class="score-label">${msg} (${pct}%)</div>
        <button class="btn-restart" onclick="restart()">Recommencer</button>`;
    }

    function restart() {
      currentQuestion = 0; score = 0; answered = false;
      document.getElementById('scoreContainer').classList.add('hidden');
      document.getElementById('quizContainer').classList.remove('hidden');
      renderQuestion();
    }

    renderQuestion();
  </script>
</body>
</html>
